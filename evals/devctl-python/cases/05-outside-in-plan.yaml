- description: Plan a multi-layer production change as component-complete outside-in TDD
  metadata:
    costTier: judged
  vars:
    request: |
      Use $devctl-python from `.agents/skills/devctl-python` to write a decision-complete
      implementation plan for adding `catalog remove NAME` to this application. Do not edit files.

      The command removes one named package from the filesystem-backed catalog. It must cover an
      empty catalog, one package, multiple packages with preserved ordering, blank/invalid names,
      missing packages, storage failures, and the supported public CLI invocation. The command
      maps application failures to stderr and a nonzero exit code.

      The plan must identify concrete test paths and interleave each scenario's test, expected
      useful RED, minimum GREEN production change, and refactor checkpoint. Start at the highest
      affected public boundary and complete its applicable scenario sequence before descending.
      Consider Zero, One, Many, Boundary, Exceptions, and Interfaces in that order, but mention an
      omitted category only when the omission is non-obvious or materially affects risk.
    fixtureDir: fixtures/outside-in-plan
    targetSkillName: devctl-python
    targetSkillDir: ../../skills/devctl-python
  assert:
    - type: javascript
      value: file://harness/assert-skill-used.mjs
      config:
        skillName: devctl-python
    - type: javascript
      value: file://harness/assert-case.mjs
      config:
        caseName: outside-in-plan
