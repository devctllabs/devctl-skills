- description: Refactor mixed filesystem and subprocess access behind capability boundaries
  metadata:
    costTier: judged
  vars:
    request: |
      Use $devctl-python from `.agents/skills/devctl-python` to refactor package discovery without
      changing its returned package names.

      Replace direct filesystem and subprocess access in `PackageService` with explicit
      constructor dependencies. The public application shape after the refactor must be:
      `PackageService(plugin_client, package_catalog).discover()`.

      Provide a concrete `CodexPluginClient(executable)` for the CLI JSON contract and a concrete
      `FilesystemPackageCatalog(root)` for local `*.toml` metadata. Keep enabled/local selection
      policy in the service, keep `Path` concrete, normalize adapter failures before they cross the
      service-facing boundary, and avoid a raw Filesystem Protocol. Use the documented unittest
      command. Establish GREEN characterization before production refactoring and keep service,
      client, and filesystem repository tests at their owning boundaries.
    fixtureDir: fixtures/io-boundaries-refactor
    targetSkillName: devctl-python
    targetSkillDir: ../../skills/devctl-python
    toolExecutables: python3
  assert:
    - type: javascript
      value: file://harness/assert-skill-used.mjs
      config:
        skillName: devctl-python
    - type: javascript
      value: file://harness/assert-case.mjs
      config:
        caseName: io-boundaries-refactor
    - type: javascript
      value: file://harness/assert-trajectory.mjs
      config:
        phases:
          - label: package discovery characterization
            mode: characterization
            testPathRegex: "tests[/\\\\].*package"
            commandRegex: "python3.*unittest"
            productionPathRegex: "src[/\\\\]package_discovery"
