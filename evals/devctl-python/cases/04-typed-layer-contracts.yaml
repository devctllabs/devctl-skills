- description: Replace anonymous records and repository helpers with typed capability boundaries
  metadata:
    costTier: deterministic
  vars:
    request: |
      Use $devctl-python from `.agents/skills/devctl-python` to refactor this run dispatch slice
      without changing its persisted JSON shape or behavior.

      Replace the public `dict[str, Any]` result with immutable `DispatchOperation` and
      `DispatchResult` domain contracts. `labels` is a genuine dynamic string-to-string semantic
      map and may remain a mapping. Make `RunService` depend on a consumer-owned `RunRepository`
      Protocol whose only capability is `dispatch(run_id, limit) -> DispatchResult`; expose the
      same operation from `RunService`.

      Add `FilesystemRunRepository(root)` as the concrete adapter. It must own JSON decoding,
      filesystem layout, reads, writes, and mapping to the domain contracts. Keep codec/layout
      helpers private to the adapter package; service code must not import repository modules or
      perform filesystem I/O. Wire the adapter in `deps`.

      Preserve the positive-limit rule and current state transition. Service tests must use a
      small repository fake; repository integration tests must use `TemporaryDirectory`. Keep
      unittest as the test runner. Add the appropriate mypy explicit-Any gate and an Import Linter
      contract forbidding service imports from repository. Add or adjust the service
      characterization test and run that exact existing suite GREEN before any production change.
      Then establish a useful RED for the new typed service contract before implementing it. Finish
      by running the complete suite.
    fixtureDir: fixtures/typed-layer-contracts
    targetSkillName: devctl-python
    targetSkillDir: ../../skills/devctl-python
    dependencySkillDirs: ../../skills/outside-in-tdd,../../skills/simplify-code
    toolExecutables: python3
  assert:
    - type: javascript
      value: file://harness/assert-skill-used.mjs
      config:
        skillName: devctl-python
    - type: javascript
      value: file://harness/assert-skill-used.mjs
      config:
        skillName: outside-in-tdd
        beforeFileChangeRegex: "(tests|src)[/\\\\]"
    - type: javascript
      value: file://harness/assert-skill-used.mjs
      config:
        skillName: simplify-code
        afterProductionPathRegex: "src[/\\\\]runtracker"
        afterGreenCommandRegex: "python(?:3)?.*unittest.*(test_dispatch|discover.*-s.*tests)"
        beforeFollowingFileChangeRegex: "(tests|src)[/\\\\]"
    - type: javascript
      value: file://harness/assert-case.mjs
      config:
        caseName: typed-layer-contracts
    - type: javascript
      value: file://harness/assert-trajectory.mjs
      config:
        phases:
          - label: existing dispatch behavior
            mode: baseline
            commandRegex: "python(?:3)?.*unittest.*test_dispatch"
            productionPathRegex: "src[/\\\\]runtracker"
          - label: typed dispatch contract
            mode: tdd
            testPathRegex: "tests[/\\\\]unit[/\\\\]service[/\\\\].*dispatch"
            commandRegex: "python(?:3)?.*unittest.*test_dispatch"
            greenCommandRegex: "python(?:3)?.*unittest.*(test_dispatch|discover.*-s.*tests)"
            productionPathRegex: "src[/\\\\]runtracker"
            forbiddenProductionPathRegex: "src[/\\\\]runtracker"
            allowSkeletonBeforeRed: true
