- description: Refactor nested argparse dispatch while preserving every public CLI leaf
  metadata:
    costTier: deterministic
  vars:
    request: |
      Use $devctl-python from `.agents/skills/devctl-python` to refactor the nested argparse CLI
      without changing its public behavior.

      The public command tree is:
      - `admin package install NAME`
      - `admin package list`
      - `admin agent install NAME`
      - `admin agent list`

      Preserve delegation through the supplied dependencies, stdout/stderr, exit codes, and the
      shared ValueError boundary. Establish GREEN characterization coverage for every executable
      leaf before changing production dispatch. Keep the implementation minimal and follow the
      repository's documented unittest command.
    fixtureDir: fixtures/nested-argparse-refactor
    targetSkillName: devctl-python
    targetSkillDir: ../../skills/devctl-python
    toolExecutables: python3
  assert:
    - type: javascript
      value: file://harness/assert-skill-used.mjs
      config:
        skillName: devctl-python
    - type: javascript
      value: file://harness/assert-case.mjs
      config:
        caseName: nested-argparse-refactor
    - type: javascript
      value: file://harness/assert-trajectory.mjs
      config:
        phases:
          - label: public CLI characterization
            mode: characterization
            testPathRegex: "tests[/\\\\].*cli"
            commandRegex: "python3.*unittest"
            productionPathRegex: "src[/\\\\]admin_cli[/\\\\]cli"
