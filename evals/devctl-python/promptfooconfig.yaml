# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Evaluate devctl-python

prompts:
  - "{{request}}"

providers:
  - id: openai:codex-sdk
    label: candidate
    config:
      codex_path_override: "codex"
      model: gpt-5.6-luna
      working_dir: "{{workspaceDir}}"
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_mode: disabled
      inherit_process_env: false
      cli_env:
        PATH: "{{workspaceDir}}/.skill-creator-evals-bin:{{ env.PATH }}"
      enable_streaming: true
      persist_threads: false
      skip_git_repo_check: false

extensions:
  - file://harness/workspace.mjs:workspaceHook

tests:
  - file://cases/01-preserve-existing-tooling.yaml
  - file://cases/02-quality-tooling-readonly.yaml
  - file://cases/03-nested-argparse-refactor.yaml
  - file://cases/04-library-kiss-tdd.yaml
  - file://cases/05-outside-in-plan.yaml
  - file://cases/06-io-boundaries-refactor.yaml
  - file://cases/07-typed-layer-contracts.yaml
  - file://cases/08-public-operation-implementation.yaml
  - file://cases/09-library-dip-tdd.yaml
  - file://cases/10-bugfix-regression-first.yaml
  - file://cases/11-quality-hotspots-readonly.yaml
  - file://cases/12-argparse-help.yaml

evaluateOptions:
  maxConcurrency: 3
  cache: false

tracing:
  enabled: true
